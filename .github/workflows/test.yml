name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests with the Command Line Tools python
        run: /usr/bin/python3 -m unittest discover tests -v
      - name: Unit tests with the runner's python3
        run: python3 -m unittest discover tests -v
